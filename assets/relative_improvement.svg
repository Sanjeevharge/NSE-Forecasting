<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" height="100%">
<style>
  .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
  .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
  .model-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
  .val-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; }
  .ref-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 3,3; }
</style>
<rect width="760" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="50" y="30" class="title">MAE Forecast Error Relative to EWMA Baseline (%)</text>
<text x="50" y="46" class="subtitle">Negative % = Outperformed EWMA benchmark (Lower Error is Better)</text>
<line x1="391.0" y1="60" x2="391.0" y2="220" class="ref-line"/>
<text x="391.0" y="52" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">EWMA Baseline (0%)</text>
<text x="115" y="88.0" class="model-label" text-anchor="end">HAR (Ridge)</text>
<rect x="317.7" y="70.0" width="73.3" height="28" rx="4" fill="#10b981"/>
<text x="309.7" y="88.0" class="val-text" fill="#10b981" text-anchor="end">-6.11%</text>
<text x="115" y="134.0" class="model-label" text-anchor="end">LightGBM</text>
<rect x="325.7" y="116.0" width="65.3" height="28" rx="4" fill="#10b981"/>
<text x="317.7" y="134.0" class="val-text" fill="#10b981" text-anchor="end">-5.44%</text>
<text x="115" y="180.0" class="model-label" text-anchor="end">Naive (RV5)</text>
<rect x="391.0" y="162.0" width="174.9" height="28" rx="4" fill="#ef4444"/>
<text x="573.9" y="180.0" class="val-text" fill="#ef4444" text-anchor="start">+14.57%</text>
</svg>