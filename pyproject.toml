[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-volatility-forecasting"
version = "1.0.0"
description = "Institutional-grade realized volatility forecasting benchmark across 15 NSE large-cap equities comparing classical econometrics (HAR, EWMA) and machine learning (LightGBM)."
readme = "README.md"
authors = [{ name = "Sanjeev" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "scipy>=1.11.0",
    "yfinance>=0.2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["s2_volatility/tests"]
python_files = "test_*.py"

